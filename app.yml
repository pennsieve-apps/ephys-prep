# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
schemaVersion: "1.0"
application:
  name: ephys-prep
  description: >-
    Prepares raw extracellular recordings (Neuropixels and other silicon probes) for spike sorting
    with SpikeInterface, following the AIND / IBL best-practice pipeline. Reads SpikeGLX, Open
    Ephys, Intan, NWB ElectricalSeries (including IBL raw NWB with explicit timestamps) and raw
    binary files with a JSON sidecar; one session per probe. Optional time window on the session
    clock (never re-zeroed), Neuropixels ADC phase-shift correction, 300 Hz high-pass, bad-channel
    detection (dead, noisy, outside the brain), common median reference or IBL destriping, and
    DREDge drift (motion) estimation, applied or left to the sorter. Writes the preprocessed
    recording (SpikeInterface binary folder with probe, brain areas and session-clock times), the
    motion estimate, session.json and QC figures.
  type: processor
  tags:
    - neuroscience
    - electrophysiology
    - neuropixels
    - nwb
    - spike-sorting
    - preprocessing
    - quality-control
    - drift-correction
    - spikeinterface
runtime:
  # Measured on 10 min of one Neuropixels 1.0 probe (IBL, 384 channels): see README "Runtime".
  cpu: 8192
  memory: 16384
  computeTypes:
    - standard
  timeoutSeconds: 21600
parameters:
  - name: T_START
    type: number
    required: false
    description: >-
      Start of the window to process, in seconds on the session clock (the source NWB's clock, or
      the recording's own). Empty: from the start. Times are kept, never re-zeroed: T_START=600
      gives spike times from 600 s.
  - name: DURATION
    type: number
    description: Length of the window in seconds; 0 = to the end of the recording.
    defaultValue: 0
    min: 0
  - name: STREAM
    type: string
    description: >-
      Which probes to process when a recording has several: comma-separated parts of stream names
      (imec0, ProbeA, Probe01, ...). Empty: every spike-band stream, one session each
      (session_id + _probe00, _probe01, ... when the recording has more than one probe).
    defaultValue: ""
  - name: FILTER
    type: string
    description: "highpass (AIND / IBL: high-pass at FREQ_MIN) or bandpass (FREQ_MIN to FREQ_MAX)."
    defaultValue: highpass
    validValues: [highpass, bandpass]
  - name: FREQ_MIN
    type: number
    description: High-pass corner in Hz.
    defaultValue: 300
    min: 1
  - name: FREQ_MAX
    type: number
    description: Low-pass corner in Hz (FILTER=bandpass only).
    defaultValue: 6000
    min: 100
  - name: PHASE_SHIFT
    type: string
    description: >-
      Correct the sub-sample delays between channels of Neuropixels probes (their ADCs sample
      channels in turn). auto: when the probe's ADC timing is known (SpikeGLX, Open Ephys, or a
      Neuropixels part number in the NWB device); true / false to force.
    defaultValue: auto
    validValues: [auto, "true", "false"]
  - name: BAD_CHANNELS
    type: string
    description: >-
      auto: detect and remove dead, noisy and outside-the-brain channels (coherence + PSD, as in
      the IBL and AIND pipelines); dead-noisy: keep the channels that look outside the brain (for
      probes fully in tissue, or simulations); none: keep every channel.
    defaultValue: auto
    validValues: [auto, dead-noisy, none]
  - name: EXCLUDE_CHANNELS
    type: string
    description: Comma-separated channel ids to remove in addition (known broken channels).
    defaultValue: ""
  - name: MAX_BAD_CHANNEL_FRACTION
    type: number
    description: A session with more bad channels than this fraction fails (something is wrong with the recording).
    defaultValue: 0.5
    min: 0.01
    max: 1
  - name: REFERENCE
    type: string
    description: >-
      cmr: common median reference over all channels (AIND default); destripe: IBL's spatial
      high-pass filter with automatic gain control (removes stripes shared by nearby channels);
      none.
    defaultValue: cmr
    validValues: [cmr, destripe, none]
  - name: MOTION_CORRECTION
    type: string
    description: >-
      estimate (default): always estimate drift with DREDge (QC figures, session.json, and the
      estimate spike-sort's CPU sorters interpolate with when the drift exceeds
      MOTION_THRESHOLD_UM); the data are not changed here, and Kilosort4 corrects drift itself.
      apply: interpolate the traces here when the drift exceeds MOTION_THRESHOLD_UM (for other
      sorters; spike-sort then corrects nothing). none: skip.
    defaultValue: estimate
    validValues: [estimate, apply, none]
  - name: MOTION_THRESHOLD_UM
    type: number
    description: >-
      Drift (largest range of the estimated displacement over the session, um) above which the
      recording is worth interpolating (Garcia et al. 2026: below ~10 um interpolation costs more
      than it gains). Recorded in session.json (motion_above_threshold); 0 = always.
    defaultValue: 10
    min: 0
  - name: MOTION_SOURCE
    type: string
    description: >-
      ap (default): DREDge on detected spikes. lfp: DREDge on the LFP (the probe's LF stream, or a
      wide-band recording), better for sparse units or fast motion (human intraoperative and NHP
      recordings); falls back to ap when there is no LFP (Neuropixels 1.0 AP data are high-passed).
    defaultValue: ap
    validValues: [ap, lfp]
  - name: MOTION_PRESET
    type: string
    description: "Spike-based DREDge preset: dredge_fast (AIND default) or dredge (slower, more precise localisation)."
    defaultValue: dredge_fast
    validValues: [dredge_fast, dredge]
  - name: BAD_TIMESTAMPS
    type: string
    description: >-
      When explicit timestamps (NWB) are broken (not increasing, or a local rate more than 0.1 %
      off the median, e.g. after a sync failure): drop keeps the longest good stretch and drops
      the rest (default); keep uses them as they are. Either way it is logged and recorded in
      session.json and summary.json.
    defaultValue: drop
    validValues: [drop, keep]
  - name: THREADS
    type: integer
    description: Worker processes; 0 = one per CPU of the container's quota.
    defaultValue: 0
    min: 0
  - name: SEED
    type: integer
    description: Seed for the random chunks used by noise and bad-channel estimates.
    defaultValue: 42
inputs:
  - name: recording
    description: >-
      Raw recordings, found by name and content anywhere below: SpikeGLX (*.ap.bin + .meta, or
      IBL *.ap.cbin), Open Ephys (binary or legacy; the folder with "Record Node" folders),
      Intan (*.rhd / *.rhs), NWB files with an ElectricalSeries in acquisition/ (spike band,
      >= 10 kHz; LFP series are skipped), SpikeInterface recording folders, or <name>.bin/.dat/.raw
      with a <name>.json sidecar (sampling_frequency, num_channels, dtype, gain_to_uV, t_start).
      Recordings without probe geometry (Intan, binary) take a probeinterface JSON next to them.
      Optional sessions.csv (session_id, path, subject_id, condition, group, ...).
    mediaTypes:
      - "application/x-hdf5; profile=nwb"
      - application/vnd.pennsieve.spikeglx
      - application/vnd.pennsieve.open-ephys-binary
      - application/vnd.pennsieve.intan
      - application/octet-stream
      - application/json
      - text/csv
    container: directory
    required: true
outputs:
  - name: recording
    description: >-
      Written to OUTPUT_DIR/recording/ephys-prep/.
      ephys-prep/<session_id>/recording/ (SpikeInterface binary_folder: int16 traces, probe,
      channel locations, brain_area when known, session-clock times), ephys-prep/<session_id>/motion/
      (SpikeInterface Motion, DREDge), ephys-prep/<session_id>/session.json (source, probe, window,
      sampling rate and clock, bad channels, motion_corrected, NWB identity), QC figures
      (<session_id>_raw_traces.png, _bad_channels.png, _drift_raster.png, _motion.png);
      ephys-prep/sessions.csv, summary.json, provenance.json.
    mediaTypes:
      - application/octet-stream
      - application/json
      - text/csv
      - image/png

  - name: qc
    description: >-
      The small files only, for linking into the report without the data (OUTPUT_DIR/qc/ephys-prep/):
      sessions.csv, summary.json, provenance.json, and per session session.json and the QC
      figures (PNG). Same paths as in the recording port.
    mediaTypes:
      - application/json
      - text/csv
      - image/png
# How a release is tested before it is made public: the inputs a review run uses.
# See app-deploy-service docs/app-manifest-review.md. The generator needs numpy only.
review:
  version: 1
  generate:
    command: python -m tests.make_fixture "$REVIEW_INPUT_DIR"
    root: input
